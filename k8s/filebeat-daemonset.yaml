# All Filebeat logs will be sent to the ELK stack via Logstash.
# This DaemonSet will run Filebeat on each node in the cluster to collect logs.
# Ensure that the ELK stack is set up to receive logs from Filebeat. Please change output.logstash accordingly.
#
# NOTE: this file and filebeat-daemonset-stg.yaml both deploy a DaemonSet/ConfigMap
# named "filebeat"/"filebeat-config" in the same "kube-system" namespace -- they are
# not independent, they manage the SAME object (cd-prod.yaml applies this file,
# cd-staging.yaml applies the -stg file). Keep them in sync; whichever pipeline
# deploys last overwrites the other's config.

apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: filebeat
  namespace: kube-system
spec:
  selector:
    matchLabels:
      k8s-app: filebeat
  template:
    metadata:
      labels:
        k8s-app: filebeat
    spec:
      containers:
      - name: filebeat
        image: docker.elastic.co/beats/filebeat:7.17.14
        args: ["-c", "/etc/filebeat.yml", "-e"]
        volumeMounts:
        - name: config
          mountPath: /etc/filebeat.yml
          subPath: filebeat.yml
        - name: logs-prod
          mountPath: /home/VMadmin/FYP_microservices/PEAR_activity_service/logs
        - name: logs-stg
          mountPath: /home/VMadmin/FYP_microservices/PEAR_activity_service_stg/logs
      volumes:
      - name: config
        configMap:
          name: filebeat-config
      - name: logs-prod
        hostPath:
          path: /home/VMadmin/FYP_microservices/PEAR_activity_service/logs
      - name: logs-stg
        hostPath:
          path: /home/VMadmin/FYP_microservices/PEAR_activity_service_stg/logs

# Define ConfigMap for Filebeat configuration
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: filebeat-config
  namespace: kube-system
data:
  filebeat.yml: |-
    filebeat.inputs:
    - type: filestream
      id: activity-production-logs
      enabled: true
      paths:
        - /home/VMadmin/FYP_microservices/PEAR_activity_service/logs/*.log
      ignore_older: 24h
      fields:
        environment: production
        service: activity

    - type: filestream
      id: activity-staging-logs
      enabled: true
      paths:
        - /home/VMadmin/FYP_microservices/PEAR_activity_service_stg/logs/*.log
      ignore_older: 24h
      fields:
        environment: staging
        service: activity

    logging.level: warning
    output.logstash:
      hosts: ["192.168.188.172:5044"]
